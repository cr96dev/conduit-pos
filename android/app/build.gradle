plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.24'
}

android {
    namespace 'com.juliabakery.pos'
    compileSdk 35

    defaultConfig {
        applicationId "com.juliabakery.pos"
        minSdk 24                 // Android 7.0 — Sunmi D3 Mini ship con 7.1+
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        // URLs configurables por build type. Override en linea de comandos:
        //   ./gradlew assembleDebug -PJULIA_BASE_URL="https://preview-foo.vercel.app"
        // Si el preview tiene Deployment Protection, agregar tambien:
        //   -PJULIA_BYPASS_TOKEN="xxxxxxxx"
        // El WebView arma el primer load con ?x-vercel-protection-bypass=... &
        // x-vercel-set-bypass-cookie=true para persistir el cookie de bypass.
        def baseUrl = project.findProperty("JULIA_BASE_URL") ?: "https://julia-bakery.vercel.app"
        def bypassToken = project.findProperty("JULIA_BYPASS_TOKEN") ?: ""
        buildConfigField "String", "JULIA_BASE_URL", "\"${baseUrl}\""
        buildConfigField "String", "JULIA_POS_PATH", "\"/pos\""
        buildConfigField "String", "JULIA_BYPASS_TOKEN", "\"${bypassToken}\""
    }

    signingConfigs {
        release {
            // Lee credenciales del keystore desde env vars — nunca hardcoded.
            // Las setea el script build-release.sh antes de invocar gradle.
            //   JULIA_KEYSTORE_FILE      ruta al .jks (default: ~/.juliabakery/julia-release.jks)
            //   JULIA_KEYSTORE_PASSWORD  contraseña del store
            //   JULIA_KEY_ALIAS          alias del key (default: julia-pos)
            //   JULIA_KEY_PASSWORD       contraseña del key (usualmente igual al store)
            def ksFile = System.getenv("JULIA_KEYSTORE_FILE") ?: "${System.getenv('HOME')}/.juliabakery/julia-release.jks"
            def ksPass = System.getenv("JULIA_KEYSTORE_PASSWORD") ?: ""
            def kAlias = System.getenv("JULIA_KEY_ALIAS") ?: "julia-pos"
            def kPass  = System.getenv("JULIA_KEY_PASSWORD") ?: ksPass
            if (file(ksFile).exists() && !ksPass.isEmpty()) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        debug {
            // Permite ver console.log() en logcat para debug.
            buildConfigField "boolean", "WEBVIEW_DEBUG", "true"
        }
        release {
            buildConfigField "boolean", "WEBVIEW_DEBUG", "false"
            minifyEnabled false       // sin obfuscacion por ahora (debug-friendly)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Aplica firma release si las env vars estan presentes; si no, gradle falla
            // con mensaje claro (mejor que silenciosamente caer a debug signing).
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'

    // Webview no necesita dependencia explicita en moderno Android.

    // JSON parsing — KMM Kotlin serialization. Liviano.
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // Sunmi InnerPrinter service: bindeamos via AIDL vendored localmente
    // (app/src/main/aidl/woyou/aidlservice/jiuiv5/). No requiere dependency
    // externa. Si el device no es Sunmi, el bind falla y caemos a stub.
}
