<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Shell suppressed for focused task but following identity guidelines) -->
<header class="bg-surface dark:bg-surface-dim flex justify-between items-center w-full px-container-margin-mobile h-16 z-50 sticky top-0">
<button class="text-primary dark:text-inverse-primary hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-inverse-primary">Julia Bakery</span>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow px-container-margin-mobile pt-stack-md pb-32 max-w-lg mx-auto w-full">
<!-- Header Section -->
<header class="mb-stack-lg">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface mb-2">¿Para quién es?</h1>
<p class="font-body-md text-on-surface-variant">Ingresá los datos de quien recibirá el pedido para asegurar que todo llegue perfecto.</p>
</header>
<!-- Form Section -->
<form class="space-y-stack-md">
<!-- Name Input -->
<div class="group flex flex-col gap-2">
<label class="font-caption-caps text-caption-caps text-on-surface-variant uppercase tracking-widest px-1" for="name">Nombre</label>
<input class="h-[52px] w-full px-4 rounded-xl bg-surface border border-outline-variant text-on-surface placeholder:text-outline font-body-md transition-all duration-200 focus:border-primary focus:ring-0 focus:bg-surface-bright" id="name" name="name" placeholder="Carlos R." type="text"/>
</div>
<!-- Phone Input -->
<div class="group flex flex-col gap-2">
<label class="font-caption-caps text-caption-caps text-on-surface-variant uppercase tracking-widest px-1" for="phone">Teléfono</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant material-symbols-outlined text-xl">phone</span>
<input class="h-[52px] w-full pl-12 pr-4 rounded-xl bg-surface border border-outline-variant text-on-surface placeholder:text-outline font-body-md transition-all duration-200 focus:border-primary focus:ring-0 focus:bg-surface-bright" id="phone" name="phone" placeholder="5555-5555" type="tel"/>
</div>
</div>
<!-- Email Input -->
<div class="group flex flex-col gap-2">
<label class="font-caption-caps text-caption-caps text-on-surface-variant uppercase tracking-widest px-1" for="email">Email</label>
<input class="h-[52px] w-full px-4 rounded-xl bg-surface border border-outline-variant text-on-surface placeholder:text-outline font-body-md transition-all duration-200 focus:border-primary focus:ring-0 focus:bg-surface-bright" id="email" name="email" placeholder="carlos@email.com" type="email"/>
</div>
<!-- NIT Input -->
<div class="group flex flex-col gap-2">
<label class="font-caption-caps text-caption-caps text-on-surface-variant uppercase tracking-widest px-1" for="nit">NIT</label>
<input class="h-[52px] w-full px-4 rounded-xl bg-surface border border-outline-variant text-on-surface placeholder:text-outline font-body-md transition-all duration-200 focus:border-primary focus:ring-0 focus:bg-surface-bright" id="nit" name="nit" placeholder="Opcional · CF si no querés factura" type="text"/>
</div>
</form>
<!-- Aesthetic Divider & Experience Note -->
<div class="mt-stack-lg p-6 bg-surface-container-low rounded-xl border border-outline-variant/30 text-center relative overflow-hidden">
<div class="absolute -right-8 -top-8 opacity-5 text-primary rotate-12">
<span class="material-symbols-outlined text-9xl">bakery_dining</span>
</div>
<p class="font-accent-tag text-accent-tag text-secondary relative z-10 italic">
                "Cuidamos cada detalle de tu entrega como si fuera para nuestra propia mesa."
            </p>
</div>
</main>
<!-- Sticky Bottom Navigation -->
<div class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-xl border-t border-outline-variant/20 p-container-margin-mobile z-50 flex flex-col gap-stack-sm md:items-center">
<div class="max-w-lg w-full flex flex-col gap-stack-sm">
<button class="w-full h-14 bg-primary text-white font-body-lg rounded-full shadow-lg shadow-primary/10 hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Continuar al pago
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center font-caption-caps text-caption-caps text-on-surface-variant">
                Paso 3 de 4: Información de Receptor
            </p>
</div>
</div>

</div>
<div class="p-6 bg-white shadow-xl rounded-2xl -rotate-1 border border-outline-variant/20">
<span class="font-caption-caps text-caption-caps text-primary uppercase block mb-2">Orgullo Local</span>
<p class="font-headline-lg text-headline-lg leading-tight">Pan artesanal para el alma.</p>
</div>
</aside>
<script>
        // Micro-interactions for form focus states
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.previousElementSibling?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.previousElementSibling?.classList.remove('text-primary');
            });
        });

        // Form submission prevention for demo
        document.querySelector('button').addEventListener('click', (e) => {
            // Optional visual feedback on click
            console.log("Procediendo al pago...");
        });
    </script>
