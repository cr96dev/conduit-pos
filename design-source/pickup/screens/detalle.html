<style>
        .material-symbols-outlined {

            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .backdrop-blur-custom {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .sheet-shadow {
            box-shadow: 0 -10px 40px rgba(106, 70, 69, 0.1);

<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Background Content (Simulated Main Screen) -->
<main class="fixed inset-0 p-container-margin-mobile flex flex-col items-center justify-center opacity-40">
<h2 class="font-headline-lg text-headline-lg mb-stack-md text-on-surface">Menú Julia Bakery</h2>
<div class="w-full max-w-md space-y-gutter">
<div class="h-32 bg-surface-container rounded-xl w-full"></div>
<div class="h-32 bg-surface-container rounded-xl w-full"></div>
<div class="h-32 bg-surface-container rounded-xl w-full"></div>
</div>
</main>
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-custom z-40"></div>
<!-- Bottom Sheet -->
<section class="fixed bottom-0 left-0 right-0 z-50 bg-surface rounded-t-[32px] max-h-[90vh] flex flex-col sheet-shadow transition-transform duration-500 ease-out" id="item-detail-sheet" style="height: 90vh; transform: translateY(0px);">
<!-- Drag Handle -->
<div class="flex justify-center pt-4 pb-2 sticky top-0 bg-surface rounded-t-[32px] z-20">
<div class="w-8 h-1 bg-stone-custom opacity-30 rounded-full"></div>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto pb-32">
<!-- Hero Image -->
<div class="relative w-full aspect-video overflow-hidden">
<img alt="Sourdough artesanal en luz dorada" class="w-full h-full object-cover" data-alt="Macro food photography of a crusty sourdough loaf on a linen cloth, golden hour light, artisan bakery setting." src="https://lh3.googleusercontent.com/aida/AP1WRLsV1ML8o1jBFiKHqatOpYuMXta-4u2bweu7zGdbSIW42AMfGVJK1laHhjeidzC2IE95IeQctVdudEJBeRje9cVbf2o16uDzM5nVu_FoWT7WPH2aMdoKBVDW-scsb-1VKkukv_WnDV4v2qKTUIZxlu67exBrrmxhIXHlUGNBuYXFKTNI5BUKLc3bXN5RcgGLQQ4XW013lAgU8B6qrRAJs8jMvgW0v1yczKHFai4uCuZBwG9hBYOEm5nvIyKQ">
<button class="absolute top-4 right-4 w-10 h-10 bg-surface/80 backdrop-blur-md rounded-full flex items-center justify-center text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Item Information -->
<div class="px-container-margin-mobile mt-stack-md">
<div class="flex justify-between items-start mb-stack-sm">
<h1 class="font-headline-lg text-headline-lg text-primary max-w-[80%] leading-tight">Cesto de Pan Artesanal</h1>
<span class="bg-secondary-fixed text-on-secondary-container px-3 py-1 rounded-full font-caption-caps text-caption-caps self-start mt-1">Sugerido</span>
</div>
<p class="font-body-md text-body-md text-outline mb-stack-md leading-relaxed">
                    Una selección curada de nuestros panes del día: masa madre, baguettes miniatura y pan de centeno. Horneado cada mañana con harinas locales y fermentación lenta.
                </p>
<!-- Quantity Selector Section -->
<div class="mt-stack-lg">
<label class="font-caption-caps text-caption-caps text-outline mb-stack-sm block">CANTIDAD</label>
<div class="flex items-center space-x-gutter">
<div class="flex items-center border border-wheat-custom rounded-xl overflow-hidden">
<button class="w-14 h-14 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95" onclick="updateQuantity(-1)">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="w-12 text-center font-price-display text-price-display text-primary" id="quantity-display">1</span>
<button class="w-14 h-14 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95" onclick="updateQuantity(1)">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- Product Details/Tags -->
<div class="grid grid-cols-2 gap-gutter mt-stack-lg">
<div class="flex items-center space-x-3 p-4 bg-surface-container-low rounded-xl">
<span class="material-symbols-outlined text-primary">timer</span>
<div>
<p class="font-caption-caps text-caption-caps text-outline">TIEMPO</p>
<p class="font-body-md text-body-md font-semibold">15-20 min</p>
</div>
</div>
<div class="flex items-center space-x-3 p-4 bg-surface-container-low rounded-xl">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">eco</span>
<div>
<p class="font-caption-caps text-caption-caps text-outline">ORIGEN</p>
<p class="font-body-md text-body-md font-semibold">Orgánico</p>
</div>
</div>
</div>
<!-- Extra Notes -->
<div class="mt-stack-lg">
<label class="font-caption-caps text-caption-caps text-outline mb-stack-sm block" for="instructions">¿ALGUNA INSTRUCCIÓN ESPECIAL?</label>
<textarea class="w-full h-32 bg-surface-container-low border border-wheat-custom rounded-xl p-4 font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all resize-none" id="instructions" placeholder="Ingresá tus preferencias aquí..."></textarea>
</div>
</div>
</div>
<!-- Sticky Footer Action -->
<div class="absolute bottom-0 left-0 right-0 p-container-margin-mobile bg-gradient-to-t from-surface via-surface to-transparent pt-8 pb-10 pointer-events-none">
<button class="pointer-events-auto w-full h-[56px] bg-primary text-on-primary rounded-xl flex items-center justify-between px-6 shadow-xl transition-all hover:opacity-95 active:scale-[0.98] duration-150">
<span class="font-body-lg text-body-lg">Agregar al pedido</span>
<span class="font-price-display text-[20px]" id="price-total">Q35.00</span>
</button>
</div>
</section>
<script>
        let quantity = 1;
        const unitPrice = 35.00;
        const quantityEl = document.getElementById('quantity-display');
        const priceEl = document.getElementById('price-total');

        function updateQuantity(delta) {
            quantity = Math.max(1, quantity + delta);
            quantityEl.innerText = quantity;
            const total = (quantity * unitPrice).toFixed(2);
            priceEl.innerText = `Q${total}`;
            
            // Interaction feedback
            quantityEl.classList.add('scale-110');
            setTimeout(() => quantityEl.classList.remove('scale-110'), 150);
        }

        // Entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const sheet = document.getElementById('item-detail-sheet');
            sheet.style.transform = 'translateY(100%)';
            setTimeout(() => {
                sheet.style.transform = 'translateY(0)';
            }, 50);
        });

        // Simple Drag Simulation for handle
        let startY = 0;
        const sheet = document.getElementById('item-detail-sheet');
        
        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });

        sheet.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            if (currentY > startY && sheet.scrollTop <= 0) {
                const diff = currentY - startY;
                sheet.style.transform = `translateY(${diff}px)`;
            }
        }, { passive: true });

        sheet.addEventListener('touchend', (e) => {
            const currentY = e.changedTouches[0].clientY;
            if (currentY - startY > 150) {
                sheet.style.transform = 'translateY(100%)';
                // In a real app, this would trigger navigation back
            } else {
                sheet.style.transform = 'translateY(0)';
            }
        });
    </script>


</body></html>
