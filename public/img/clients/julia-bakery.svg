<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Disco exterior -->
  <circle cx="200" cy="160" r="88" fill="none" stroke="#8B5A3C" stroke-width="3"/>
  <!-- Disco interior tono pan dorado -->
  <circle cx="200" cy="160" r="78" fill="#D4A574"/>

  <!-- Cuerpo del pan: hogaza estilizada -->
  <ellipse cx="200" cy="170" rx="48" ry="32" fill="#F5E6D3" stroke="#5D3A1F" stroke-width="2"/>
  <!-- Cortes superiores del pan -->
  <path d="M 170 152 Q 178 142 188 152" fill="none" stroke="#5D3A1F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 190 148 Q 200 138 210 148" fill="none" stroke="#5D3A1F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 212 152 Q 222 142 230 152" fill="none" stroke="#5D3A1F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Espigas de trigo a los lados -->
  <g stroke="#8B5A3C" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Espiga izquierda -->
    <line x1="142" y1="170" x2="158" y2="158"/>
    <line x1="146" y1="162" x2="156" y2="160"/>
    <line x1="146" y1="178" x2="156" y2="180"/>
    <line x1="138" y1="172" x2="148" y2="168"/>
    <line x1="138" y1="172" x2="148" y2="178"/>
    <!-- Espiga derecha -->
    <line x1="258" y1="170" x2="242" y2="158"/>
    <line x1="254" y1="162" x2="244" y2="160"/>
    <line x1="254" y1="178" x2="244" y2="180"/>
    <line x1="262" y1="172" x2="252" y2="168"/>
    <line x1="262" y1="172" x2="252" y2="178"/>
  </g>

  <!-- Pequeñas marcas alrededor (como rayos suaves) -->
  <line x1="200" y1="92" x2="200" y2="100" stroke="#8B5A3C" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="143" x2="150" y2="150" stroke="#8B5A3C" stroke-width="2" stroke-linecap="round"/>
  <line x1="255" y1="143" x2="250" y2="150" stroke="#8B5A3C" stroke-width="2" stroke-linecap="round"/>
  <line x1="134" y1="200" x2="142" y2="196" stroke="#8B5A3C" stroke-width="2" stroke-linecap="round"/>
  <line x1="266" y1="200" x2="258" y2="196" stroke="#8B5A3C" stroke-width="2" stroke-linecap="round"/>

  <!-- Texto principal -->
  <text x="360" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#5D3A1F" letter-spacing="-1">Julia</text>
  <text x="360" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="400" font-style="italic" fill="#8B5A3C" letter-spacing="1">Bakery</text>

  <!-- Linea separadora -->
  <line x1="360" y1="210" x2="600" y2="210" stroke="#E8D5B7" stroke-width="1"/>

  <!-- Tagline -->
  <text x="362" y="234" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#8B5A3C" letter-spacing="3">PANADERIA · GUATEMALA</text>

  <!-- Pequenos puntos decorativos -->
  <circle cx="362" cy="256" r="3" fill="#5D3A1F"/>
  <circle cx="372" cy="256" r="3" fill="#D4A574"/>
  <circle cx="382" cy="256" r="3" fill="#8B5A3C" opacity="0.4"/>
</svg>
